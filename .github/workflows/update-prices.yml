name: Mise à jour des prix
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node update-prices.js
      - name: Enregistrer les prix
        run: |
          git config user.name "prix-bot"
          git config user.email "prix-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "Mise à jour des prix"
          git push
